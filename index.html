  color: rgb(255 176 32 / var(--tw-text-opacity, 1));
}

.text-\[var\(--muted\)\] {
  color: var(--muted);
}

.text-\[var\(--navy\)\] {
  color: var(--navy);
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.shadow-\[0_10px_35px_rgba\(10\2c 42\2c 77\2c 0\.10\)\] {
  --tw-shadow: 0 10px 35px rgba(10,42,77,0.10);
  --tw-shadow-colored: 0 10px 35px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-lg {
  --tw-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 10px 15px -3px var(--tw-shadow-color), 0 4px 6px -4px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.ring-2 {
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.ring-\[\#0A2A4D\]\/20 {
  --tw-ring-color: rgb(10 42 77 / 0.2);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.\[overflow-wrap\:anywhere\] {
  overflow-wrap: anywhere;
}

:root {
  --navy: #0A2A4D;
  --navy-deep: #071F3A;
  --navy-soft: #123F6B;
  --paper: #F2F5F9;
  --surface: #FFFFFF;
  --surface-2: #EAF0F7;
  --ink: #101D2E;
  --muted: #5C6D81;
  --line: #D8E1EC;
  --accent: #FFB020;
  --accent-2: #1FB57B;
  --danger: #E23D3D;
  --correct: #15865A;
  --correct-bg: #E5F7EE;
  --wrong-bg: #FDECEC;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #071323;
    --surface: #0E233A;
    --surface-2: #173450;
    --ink: #F1F6FB;
    --muted: #A8BCCF;
    --line: #264464;
    --correct-bg: #123A2B;
    --wrong-bg: #4A1D24;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--navy);
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: ui-sans-system, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button {
  font: inherit;
}

button:focus-visible, a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.option-card {
  transition: transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
}

.option-card:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(10,42,77,.10);
}

.option-card:active:not(:disabled) {
  transform: translateY(0);
}

.hover\:bg-\[\#123F6B\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(18 63 107 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#ffc44d\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(255 196 77 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}

.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-8 {
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-\[27px\] {
    font-size: 27px;
  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}
